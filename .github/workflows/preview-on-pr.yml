name: Preview on PR

# 给 PR 打上 `deploy:preview` 标签后，自动把该 PR 最新提交部署到 preview 并做只读探针，结果评论到 PR。
# 仅限同仓库分支；仅 preview 环境，不碰生产，不执行任何 D1 迁移。
on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: preview-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: contains(github.event.pull_request.labels.*.name, 'deploy:preview') && github.event.pull_request.head.repo.full_name == github.repository && (github.event.action != 'labeled' || github.event.label.name == 'deploy:preview')
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and test
        run: npm test
      - name: Check Cloudflare preview secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID in the 'preview' GitHub Environment secrets."
            exit 1
          fi
      - name: Deploy dist/ to Cloudflare Pages (preview)
        id: wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'fantasme-apply-test' }} --branch=preview
      - name: Read-only probes and report
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.wrangler.outputs.deployment-url }}
        with:
          script: |
            const base = 'https://preview.fantasme-apply-test.pages.dev';
            const probes = [['/api/setup-status', [200]], ['/login', [200]], ['/embed-login', [200]], ['/api/ai/status', [401]], ['/api/integrations/assistant/advisors', [401, 503]]];
            const rows = []; let ok = true;
            for (const [path, expect] of probes) {
              let code = 0;
              try { code = (await fetch(base + path, { redirect: 'manual' })).status; } catch (e) { code = 0; }
              const pass = expect.includes(code); ok = ok && pass;
              rows.push(`| \`${path}\` | ${code} | ${pass ? '✅' : '❌ 期望 ' + expect.join('/')} |`);
            }
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `[Bot] Preview 已部署（\`${sha}\`）：${process.env.DEPLOY_URL || base}\n\n| 探针（未登录、只读） | 状态码 | 结果 |\n|---|---|---|\n${rows.join('\n')}\n\n${ok ? '✅ 基础探针全部符合预期。' : '❌ 有探针不符合预期，请查看 Actions 日志。'}数据库迁移：未执行。`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.payload.pull_request.number, body });
