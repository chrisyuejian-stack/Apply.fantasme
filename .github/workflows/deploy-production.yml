name: Deploy Production (fantasme-apply)

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-ops
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Guard target project and secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PROJECT_NAME="fantasme-apply"

          if [ "$PROJECT_NAME" = "fantasme-academic" ]; then
            echo "::error::Forbidden legacy project 'fantasme-academic' cannot be targeted."
            exit 1
          fi
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID in the 'production' GitHub Environment secrets."
            exit 1
          fi

      - name: Verify Pages project and APPLY_DB binding exist
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node <<'EOF'
          const accountId = process.env.CF_ACCOUNT;
          const token = process.env.CF_TOKEN;
          const PROJECT = 'fantasme-apply';

          async function main() {
            const res = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/${PROJECT}`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            const data = await res.json();
            if (!res.ok || !data?.success) {
              throw new Error(`Pages project '${PROJECT}' not found or unreachable (${res.status}); run provision-production.yml first.`);
            }
            const applyDbId = data.result?.deployment_configs?.production?.d1_databases?.APPLY_DB?.id || '';
            if (!applyDbId) {
              throw new Error(`Pages project '${PROJECT}' is missing production APPLY_DB binding; run provision-production.yml first.`);
            }
            console.log(`Verified Pages project '${PROJECT}' with production APPLY_DB binding (${applyDbId}).`);
          }

          main().catch((err) => {
            console.error(err.message || err);
            process.exit(1);
          });
          EOF

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build and run baseline tests (no D1 DDL)
        run: npm test

      - name: Deploy dist/ to Cloudflare Pages (fantasme-apply, branch main)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=fantasme-apply --branch=main
